<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>105 在场景中根据边数绘制多边形</h1>
  <p><button id="myButton1">绘制实心三角形</button>
 <button id="myButton2">绘制实心五边形</button></p>
<center id="myContainer" ></center>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize( window.innerHeight, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera = new THREE.PerspectiveCamera( 45, 1, 1, 1000 );
 myCamera.position.set( 0, 0,160 );
 myCamera.lookAt(myScene.position);
 let myMesh;
 //渲染图形
 animate();
 function animate(){
  myRenderer.render(myScene,myCamera);
  requestAnimationFrame(animate);
 }
 //响应单击“绘制实心三角形”按钮
 $("#myButton1").click(function(){
  if(myMesh) myScene.remove(myMesh);
  let myMaterial=new THREE.MeshBasicMaterial({color: 0x0000ff});
  let myGeometry = new THREE.CircleGeometry(50,3); // 切片熟练足够小，则直接显示为圆的内接正多边形
  myMesh = new THREE.Mesh( myGeometry, myMaterial );
  myScene.add(myMesh);
 });
 //响应单击“绘制实心五边形”按钮
 $("#myButton2").click(function(){
  if(myMesh) myScene.remove(myMesh);
  let myMaterial=new THREE.MeshBasicMaterial({color: 0x0000ff});
  let myGeometry = new THREE.CircleGeometry(50,5);
  myMesh = new THREE.Mesh( myGeometry, myMaterial );
  myScene.add(myMesh);
 });
</script></body>
</html>
