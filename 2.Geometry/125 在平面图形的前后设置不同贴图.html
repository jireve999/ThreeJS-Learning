<html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>125 在平面图形的前后设置不同贴图</h1>
  <center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene = new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera = new THREE.PerspectiveCamera(45,
     window.innerWidth / window.innerHeight, 1, 1000);
 myCamera.position.set(0, 0, 400);
 myScene.add(myCamera);
 myScene.add(new THREE.AmbientLight(0xffffff));
 //封装包含正面和反面图像的平面
 let myGroup = new THREE.Group();
 let myPlaneGeometry = new THREE.PlaneGeometry(160,240, 5, 5);
 let myFrontMap = THREE.ImageUtils.loadTexture("../images/img137.jpg");
 let myBackMap = THREE.ImageUtils.loadTexture("../images/img138.jpg");
 let myFrontPlane = new THREE.Mesh(myPlaneGeometry,
     new THREE.MeshPhongMaterial({map: myFrontMap, side: THREE.FrontSide}));
 let myBackPlane = new THREE.Mesh(myPlaneGeometry,
     new THREE.MeshPhongMaterial({map: myBackMap, side: THREE.BackSide}));
 myGroup.add(myFrontPlane);
 myGroup.add(myBackPlane);
 myScene.add(myGroup);
 //渲染包含正面和反面图像的平面
 animate();
 function animate() {
  myRenderer.render(myScene, myCamera);
  myGroup.rotation.y+=0.01;
  requestAnimationFrame(animate);
 }
</script></body></html>
