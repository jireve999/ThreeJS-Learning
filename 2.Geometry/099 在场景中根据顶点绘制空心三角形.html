<html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>099 在场景中根据顶点绘制空心三角形</h1>
  <p><button id="myButton1">绘制空心三角形</button>
 <button id="myButton2">绘制实心三角形</button></p>
<center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,1,1000);
 myCamera.position.set(0,0,100);
 myScene.add(myCamera);
 myScene.add(new THREE.AmbientLight(0xffffff));
 let myTriangle;
 //渲染三角形
 animate();
 function animate(){
  myRenderer.render(myScene,myCamera);
  requestAnimationFrame(animate);
 }
 //响应单击“绘制空心三角形”按钮
 $("#myButton1").click(function(){
  if(myTriangle) myScene.remove(myTriangle);
  let x = -30, y = -30,myPoints=[];
  myPoints.push(new THREE.Vector2(x, y));
  myPoints.push(new THREE.Vector2(x + 60, y+60));
  myPoints.push(new THREE.Vector2(x , y+60));
  myPoints.push(new THREE.Vector2(x , y));
  let myGeometry=new THREE.Geometry().setFromPoints(myPoints);
  myTriangle=new THREE.Line(myGeometry,
      new THREE.LineBasicMaterial({color:0xff0000}));
  myScene.add(myTriangle);
 });
 //响应单击“绘制实心三角形”按钮
 $("#myButton2").click(function(){
  if(myTriangle) myScene.remove(myTriangle);
  let myShape = new THREE.Shape();
  let x = -30, y = -30;
  myShape.moveTo( x, y);
  myShape.lineTo( x + 60, y+60);
  myShape.lineTo( x , y+60);
  myShape.lineTo( x , y);
  let myGeometry = new THREE.ShapeGeometry(myShape);
  let myMaterial = new THREE.MeshLambertMaterial({color:'red'});
  myTriangle= new THREE.Mesh(myGeometry,myMaterial);
  myScene.add(myTriangle);
 });
</script></body>
</html>
