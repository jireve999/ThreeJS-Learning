<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>129 在场景中加载中文字库绘制汉字</h1>
  <center id="myContainer"></center>
<script type="text/javascript">
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene = new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera = new THREE.OrthographicCamera(-2.5,2.5,1.875,-1.875,1,100);
 myCamera.position.set(3, 3, 20);
 myCamera.lookAt(new THREE.Vector3(2, 1, 0));
 myScene.add(myCamera);
 let myLight = new THREE.DirectionalLight('white');
 myLight.position.set(-5, 10, 5);
 myScene.add(myLight);
 //加载中文字体并绘制斜角汉字
 let myFontLoader = new THREE.FontLoader();
 myFontLoader.load('../Data/MicrosoftYaHei_Regular.json', function(font) {
  let myTextGeometry=new THREE.TextGeometry('代码集锦',
      {font: font, size: 0.8, height: 1, curveSegments: 120,
       bevelEnabled: true, bevelThickness:1.5,
       bevelSize: 0.05, bevelSegments: 3 });
  //创建金属发亮材质
  let myMaterial =new THREE.MeshPhongMaterial({color: 0x00ff00 });
  let myTextMesh = new THREE.Mesh(myTextGeometry, myMaterial);
  myTextMesh.position.y=0.5;
  myScene.add(myTextMesh);
 });
 //渲染绘制的斜角汉字
 animate();
 function animate() {
  requestAnimationFrame(animate);
  myRenderer.render(myScene, myCamera);
 }
</script></body>
</html>
