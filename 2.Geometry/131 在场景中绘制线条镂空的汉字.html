<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>131 在场景中绘制线条镂空的汉字</h1>
  <center id="myContainer" ></center>
<script type="text/javascript">
 //初始化渲染器
 let myRenderer=new THREE.WebGLRenderer({antialias:true});
 myRenderer.setPixelRatio(window.devicePixelRatio);
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.setClearColor("white");
 $("#myContainer").append(myRenderer.domElement);
 let myCamera=new THREE.PerspectiveCamera(30,
     window.innerWidth/window.innerHeight,1,1500);
 myCamera.position.set(0,400,700);
 myCamera.lookAt(new THREE.Vector3(0,150,0));
 let myScene=new THREE.Scene();
 //初始化FontLoader，并加载指定汉字字库
 let myFontLoader=new THREE.FontLoader();
 myFontLoader.load('../Data/MicrosoftYaHei_Regular1.json',function(font){
  let myMaterial=new THREE.LineBasicMaterial({color:0x00ff00});
  //将文本(字)转换为图形
  let myShapes=font.generateShapes('罗斌',120); // text，size
  let myShapeGeometry=new THREE.ShapeBufferGeometry(myShapes); // 创建图形缓冲几何体
  myShapeGeometry.computeBoundingBox(); // 调用完generateShapes，一定要用此方法计算当前几何体的范围
  let myOffsetX=(myShapeGeometry.boundingBox.min.x
      -myShapeGeometry.boundingBox.max.x)/2;
  //初始化数组，用于保存图形轮廓信息
  let myHoles=[];
  for(let i=0;i<myShapes.length;i++){
   let myShape=myShapes[i];
   if(myShape.holes&&myShape.holes.length>0){
    for(let j=0;j<myShape.holes.length;j++){
     let myHole=myShape.holes[j];
     myHoles.push(myHole);
    }
   }
  }
  myShapes.push.apply(myShapes,myHoles);
  let myTextLines=new THREE.Object3D();
  for(let i=0;i<myShapes.length;i++){
   //获取每个字符对应的图形
   let myShape=myShapes[i];
   //获取当前图形坐标点
   let myPoints=myShape.getPoints();
   //根据坐标点初始化BufferGeometry，并设置其所在位置
   let myGeometry=new THREE.BufferGeometry().setFromPoints(myPoints);
   myGeometry.translate(myOffsetX,100,0);
   //创建文字线条，实现镂空效果
   let myTextLine=new THREE.Line(myGeometry,myMaterial);
   myTextLines.add(myTextLine);
  }
  //在场景中添加线条
  myScene.add(myTextLines);
 });
 //渲染镂空汉字
 animate();
 function animate(){
  requestAnimationFrame(animate);
  myRenderer.render(myScene,myCamera);
 }
</script></body>
</html>
