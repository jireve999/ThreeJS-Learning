<html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>107 在场景中使用虚线绘制桃心</h1>
  <p><button id="myButton1">使用实线绘制桃心</button>
 <button id="myButton2">使用虚线绘制桃心</button></p>
<center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,1,1000);
 myCamera.position.set(0,0,440);
 myScene.add(myCamera);
 myScene.add(new THREE.AmbientLight(0xffffff));
 //定义中心点坐标
 let x=0,y=0;
 //使用贝塞尔曲线生成桃心图形
 let myShape=new THREE.Shape().moveTo(x+25,y+25 )
     .bezierCurveTo(x+25,y+25,x+20,y,x,y)
     .bezierCurveTo(x-30,y,x-30,y+35,x-30,y+35)
     .bezierCurveTo(x-30,y+55,x-10,y+77,x+25,y+95)
     .bezierCurveTo(x+60,y+77,x+80,y+55,x+80,y+35)
     .bezierCurveTo(x+80,y+35,x+80,y,x+50,y)
     .bezierCurveTo(x+35,y,x+25,y+25,x+25,y+25);
 //渲染桃心图形
 let myHeart;
 animate();
 function animate(){
  myRenderer.render(myScene,myCamera);
  requestAnimationFrame(animate);
 }
 //响应单击“使用实线绘制桃心”按钮
 $("#myButton1").click(function(){
  if(myHeart) myScene.remove(myHeart);
  let myGeometry=new THREE.ShapeGeometry(myShape);
  myHeart=new THREE.Line(myGeometry,
      new THREE.LineBasicMaterial({color:0xff0000}));
  myHeart.position.set(60,100,75);
  myHeart.rotation.set(0,0,Math.PI);
  myHeart.scale.set(2,2,2);
  myScene.add(myHeart);
 });
 //响应单击“使用虚线绘制桃心”按钮
 $("#myButton2").click(function(){
  if(myHeart) myScene.remove(myHeart);
  let myGeometryPoints=
      new THREE.BufferGeometry().setFromPoints(myShape.getPoints());
  myHeart=new THREE.Points(myGeometryPoints,
      new THREE.PointsMaterial({color:0xff0000,size:6})); // 使用虚线-小方点绘制桃心图形
  myHeart.position.set(60,100,75);
  myHeart.rotation.set(0,0,Math.PI);
  myHeart.scale.set(2,2,2);
  myScene.add(myHeart);
 });
</script></body>
</html>
