<html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>109 在场景中沿着桃心边线移动小球</h1>
  <center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,1,1000);
 myCamera.position.set(0,0,200);
 myScene.add(myCamera);
 myScene.add(new THREE.AmbientLight(0xffffff));
 //设置中心点坐标
 let x=-20,y=-40;
 //使用贝塞尔曲线生成桃心
 let myShape=new THREE.Shape().moveTo(x+25,y+25 )
     .bezierCurveTo(x+25,y+25,x+20,y,x,y)
     .bezierCurveTo(x-30,y,x-30,y+35,x-30,y+35)
     .bezierCurveTo(x-30,y+55,x-10,y+77,x+25,y+95)
     .bezierCurveTo(x+60,y+77,x+80,y+55,x+80,y+35)
     .bezierCurveTo(x+80,y+35,x+80,y,x+50,y)
     .bezierCurveTo(x+35,y,x+25,y+25,x+25,y+25);
 let myPoints=myShape.getPoints();
 let myGeometryPoints=new THREE.BufferGeometry().setFromPoints(myPoints);
 let myHeart=new THREE.Points(myGeometryPoints,
     new THREE.PointsMaterial({color:0xff0000,size:6}));
 myScene.add(myHeart);
 //创建小球
 let myGeometry=new THREE.SphereGeometry(10,10,10);
 let myTexture=THREE.ImageUtils.loadTexture("../images/img055.jpg");
 let myMaterial=new THREE.MeshBasicMaterial({map:myTexture});
 let mySphere=new THREE.Mesh(myGeometry,myMaterial);
 myScene.add(mySphere);
 //渲染小球沿着桃心曲线移动
 let myIndex=0;
 let mylength=myPoints.length;
 animate();
 function animate(){
  myRenderer.render(myScene,myCamera);
  if(myIndex==mylength-1){ myIndex=0;}
  else{myIndex+=1;}
  mySphere.position.set(myPoints[myIndex].x,myPoints[myIndex].y,0); // 设置小球位置
  requestAnimationFrame(animate);
 }
</script></body>
</html>
