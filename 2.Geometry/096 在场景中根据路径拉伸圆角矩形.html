<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/OrbitControls.js"></script>
</head>
<body>
  <h1>096 在场景中根据路径拉伸圆角矩形</h1>
  <center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer({antialias: true} );
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 myRenderer.setClearColor('white', 1.0);
 $("#myContainer").append(myRenderer.domElement);
 let myCamera = new THREE.PerspectiveCamera(45, 1, 1, 1000);
 myCamera.position.set(200, 200, 200);
 myCamera.lookAt({ x: 0, y: 0, z: 0 });
 let myScene = new THREE.Scene();
 let myPointLight = new THREE.PointLight('white');
 myPointLight.position.set(320, 200, 400);
 myScene.add(myPointLight);
 //创建圆角矩形
 let myShape = new THREE.Shape();
 let x=0, y=0, myWidth=30, myHeight=40, myRadius=6
 myShape.moveTo( x, y + myRadius );
 myShape.lineTo( x, y + myHeight - myRadius );
 myShape.quadraticCurveTo( x, y + myHeight, x + myRadius, y + myHeight ); // cpx,cpy,x,y
 myShape.lineTo( x + myWidth - myRadius, y + myHeight) ;
 myShape.quadraticCurveTo( x + myWidth, y + myHeight,
     x + myWidth, y + myHeight - myRadius );
 myShape.lineTo( x + myWidth, y + myRadius );
 myShape.quadraticCurveTo( x + myWidth, y, x + myWidth - myRadius, y );
 myShape.lineTo( x + myRadius, y );
 myShape.quadraticCurveTo( x, y, x, y + myRadius );
 //设置拉伸圆角矩形的路径
 let myCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3( 0,0,0 ), new THREE.Vector3( 0,30,0 )]); // 根据指定的点创建一条平滑曲线
 //创建拉伸之后的圆角矩形
 let myGeometry = new THREE.ExtrudeGeometry(myShape,{extrudePath:myCurve}); 
 let myMaterial=new THREE.MeshPhongMaterial({ color:'cyan'});
 let myMesh = new THREE.Mesh(myGeometry, myMaterial);
 myMesh.translateX(100 );
 myMesh.translateZ(100);
 myMesh.translateY(0);
 myScene.add(myMesh);
 //渲染圆角矩形
 let step=0;
 animate();
 function  animate(){
  myRenderer.render(myScene, myCamera);
  step = step +0.01;
  let myScale= 2 * Math.sin(step) + 2;
  myMesh.scale.y = myScale;
  myMesh.scale.x =2;
  myMesh.scale.z = 2;
  requestAnimationFrame(animate);
 }
 let myOrbitControls = new THREE.OrbitControls(myCamera);
</script></body></html>
