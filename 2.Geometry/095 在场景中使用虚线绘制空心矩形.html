<!DOCTYPE html><html><head><meta charset="UTF-8">
 <!-- <script src="http://threejs.org/build/three.js"></script>-->
 <!-- <script src="http://cdn.bootcss.com/jquery/3.4.1/jquery.js"></script>-->
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>095 在场景中使用虚线绘制空心矩形</h1>
  <center id="myContainer" ></center>
<script>
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer();
 myRenderer.setSize(400, 300);
 myRenderer.setClearColor("white", 1);
 $("#myContainer").append(myRenderer.domElement);
 let myScene = new THREE.Scene();
 let myCamera = new THREE.PerspectiveCamera( 45,
     window.innerWidth / window.innerHeight, 1, 500 );
 myCamera.position.set( 0, 0, 100 );
 myCamera.lookAt(myScene.position);
 //创建虚线空心矩形
 let myPoints = [];
 myPoints.push( new THREE.Vector3( -50, 30, 0 ) );				//左上顶点
 myPoints.push( new THREE.Vector3( 50, 30, 0 ) );  				//右上顶点
 myPoints.push( new THREE.Vector3( 50, -20, 0 ) );  				//右下顶点
 myPoints.push( new THREE.Vector3( -50, -20, 0 ) );				//左下顶点
 myPoints.push( new THREE.Vector3( -50, 30, 0 ) );				//左上顶点
 let myGeometry = new THREE.BufferGeometry().setFromPoints( myPoints );
 let myMaterial=new THREE.LineDashedMaterial({vertexColors: true,scale: 1.0 });
 //根据顶点绘制线条
 let myLine = new THREE.Line( myGeometry, myMaterial );
 myLine.computeLineDistances();  
 myLine.position.set(3, -5, 0);
 myScene.add( myLine );
 //渲染虚线空心矩形
 myRenderer.render(myScene, myCamera);
</script></body>
</html>
