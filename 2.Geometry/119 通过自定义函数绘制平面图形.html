<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/OrbitControls.js"></script>
</head>
<body>
  <h1>119 通过自定义函数绘制平面图形</h1>
  <center id="myContainer" ></center>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setClearColor('white', 1.0);
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,0.1,1000);
 myCamera.position.set(0,-201,0);
 let myScene=new THREE.Scene();
 myScene.add(new THREE.AmbientLight(0xffffff,0.9));
 //渲染图形
 animate();
 function animate(){
  myRenderer.render(myScene,myCamera);
  requestAnimationFrame(animate);
 }
 //创建平面图形(或使用ParametricBufferGeometry)
 let myGeometry=new THREE.ParametricGeometry(function(u,v,target){
  let x = u*10;
  let y = 0;
  let z = v*10;
  target.set(x, y, z).multiplyScalar(15);
 },8,8);
 //使用线框创建平面图形的材质
 let myPhongMaterial =
     new THREE.MeshPhongMaterial({color:0x0000ff,wireframe:true});
 let myPlaneMesh=new THREE.Mesh(myGeometry,myPhongMaterial);
 myPlaneMesh.position.x=-70;
 myPlaneMesh.position.z=-80;
 myScene.add(myPlaneMesh);
 //创建轨道控制器(旋转、缩放图形)
 let myOrbitControls=new THREE.OrbitControls(myCamera);
</script></body></html>
