<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/OrbitControls.js"></script>
</head>
<body>
  <h1>116 通过自定义函数绘制莫比乌斯环</h1>
  <center id="myContainer" ></center>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.setClearColor('white', 1.0);
 $("#myContainer").append(myRenderer.domElement);
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,1,2000);
 myCamera.position.set(214,65.42,263.44);
 myCamera.lookAt(new THREE.Vector3(0, 0, 0));
 let myScene=new THREE.Scene();
 let myAmbientLight=new THREE.AmbientLight(0xcccccc,0.4);
 myScene.add(myAmbientLight);
 let myPointLight=new THREE.PointLight(0xffffff,0.8);
 myScene.add(myPointLight);
 //渲染图形
 animate();
 function animate(){
  myRenderer.render(myScene,myCamera);
  requestAnimationFrame(animate);
 }
 //创建莫比乌斯环(或使用ParametricBufferGeometry)
 let myGeometry=new THREE.ParametricGeometry(function(u,t,target){
  u-=0.5;
  let v=2*Math.PI*t;
  let x=Math.cos(v)*(2+u*Math.cos(v/2));
  let y=Math.sin(v)*(2+u*Math.cos(v/2));
  let z=u*Math.sin(v/2);
  target.set(x,y,z);
 },200,200);
 let myMaterial=new THREE.MeshPhongMaterial({
  color:0x0000ff, side:THREE.DoubleSide});
 let myMobiusMesh=new THREE.Mesh(myGeometry,myMaterial);
 //将莫比乌斯环放大50倍
 myMobiusMesh.scale.multiplyScalar(50);
 myScene.add(myMobiusMesh);
 //创建轨道控制器(旋转、缩放图形)
 let myOrbitControls=new THREE.OrbitControls(myCamera);
</script></body></html>
