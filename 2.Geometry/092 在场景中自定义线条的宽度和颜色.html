<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/LineSegmentsGeometry.js"></script>
 <script src="../ThreeJS/LineMaterial.js"></script>
 <script src="../ThreeJS/LineGeometry.js"></script>
 <script src="../ThreeJS/LineSegments2.js"></script>
 <script src="../ThreeJS/Line2.js"></script>
 <script src="../ThreeJS/GeometryUtils.js"></script>
 <script src="../ThreeJS/OrbitControls.js"></script>
</head>
<body>
  <h1>092 在场景中自定义线条的宽度和颜色</h1>
  <center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera = new THREE.PerspectiveCamera( 40,
     window.innerWidth / window.innerHeight, 1, 1000 );
 myCamera.position.set( - 40, 0, 60 );
 myScene.add(myCamera);
 let myOrbitControls =
     new THREE.OrbitControls( myCamera, $("#myContainer")[0] );
 //自定义图形的线条宽度和颜色
 let myPositions = [];
 let myColors = [];
 let myPoints = THREE.GeometryUtils.hilbert3D(new THREE.Vector3( 0, 0, 0));
 let myCurve = new THREE.CatmullRomCurve3( myPoints );
 let divisions = Math.round( 12 * myPoints.length );
 let myPoint = new THREE.Vector3();
 let myColor = new THREE.Color();
 for ( let i = 0, l = divisions; i < l; i ++ ) {
  let t = i / l;
  myCurve.getPoint( t, myPoint );
  myPositions.push( myPoint.x, myPoint.y, myPoint.z );
  myColor.setHSL( t, 1.0, 0.5 );
  myColors.push( myColor.r, myColor.g, myColor.b );
 }
 let myGeometry = new THREE.LineGeometry();
 myGeometry.setPositions( myPositions );
 myGeometry.setColors( myColors );
 let myMaterial=new THREE.LineMaterial({ linewidth: 20, vertexColors: true});
 let myLine = new THREE.Line2( myGeometry, myMaterial );
 myLine.scale.set(2,2,2);
 myMaterial.resolution.set( window.innerWidth, window.innerHeight );
 myScene.add( myLine);
 //渲染图形
 animate();
 function animate(){
  myRenderer.render(myScene,myCamera);
  requestAnimationFrame(animate);
 }
</script></body></html>
