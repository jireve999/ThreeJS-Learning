<html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>101 在场景中根据顶点绘制空心五角星</h1>
  <p><button id="myButton1">绘制空心五角星</button>
 <button id="myButton2">绘制实心五角星</button></p>
<center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer=new THREE.WebGLRenderer({antialias:true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 myScene.background=new THREE.Color('white');
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,1,1000);
 myCamera.position.set(0,0,140);
 myScene.add(myCamera);
 myScene.add(new THREE.AmbientLight(0xffffff));
 //使用数组保存五角星顶点坐标,如果myCount=6,则为六角星，
 //如果myCount=7,则为七角星，依此类推
 let myPoints=[],myCount=5,myStar;
 for(let i=0;i<myCount*2;i++){
  let l=i%2==1?24:48;
  let a=i/myCount*Math.PI;
  myPoints.push(new THREE.Vector2(Math.cos(a)*l,Math.sin(a)*l));
 }
 //添加五角星的第一个顶点坐标，使其构成封闭图形
 myPoints.push(new THREE.Vector2(48,0));
 //渲染五角星
 animate();
 function animate(){
  myRenderer.render(myScene,myCamera);
  requestAnimationFrame(animate);
 }
 //响应单击“绘制空心五角星”按钮
 $("#myButton1").click(function(){
  if(myStar)myScene.remove(myStar);
  let myGeometry=new THREE.Geometry().setFromPoints(myPoints);
  myStar=new THREE.Line(myGeometry,
      new THREE.LineBasicMaterial({color:0xff0000}));
  myScene.add(myStar);
 });
 //响应单击“绘制实心五角星”按钮
 $("#myButton2").click(function(){
  if(myStar)myScene.remove(myStar);
  let myGeometry=new THREE.ShapeGeometry(new THREE.Shape(myPoints)); // 根据指定顶点创建实心几何体
  myStar=new THREE.Mesh(myGeometry,new THREE.MeshPhongMaterial({
   color:0xff0000,side:THREE.DoubleSide}));
  myScene.add(myStar);
 });
</script></body>
</html>
