<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>093 在场景中根据二维坐标绘制螺线</h1>
  <center id="myContainer" ></center>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize( window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 myScene.background = new THREE.Color('white');
 myScene.add(new THREE.AmbientLight(0xffffff));
 let myCamera = new THREE.PerspectiveCamera( 45, 1, 0.1, 1000 );
 myCamera.position.set(16,-20,124);
 myCamera.lookAt(myScene.position);
 //创建阿基米德螺线
 let myPoints=[];
 for(let i=0;i<360*10;i++){
  //根据阿基米德螺线方程计算坐标
  let myX=i*Math.cos(i*Math.PI/180)/100;
  let myY=i*Math.sin(i*Math.PI/180)/100;
  //使用Vector2封装二维坐标
  myPoints.push(new THREE.Vector2(myX,myY));
 }
 let myCurve=new THREE.SplineCurve(myPoints);
 let myGeometry=new THREE.BufferGeometry();
 //myGeometry.setFromPoints(myCurve.getPoints(60));
 myGeometry.setFromPoints(myCurve.getPoints(600));
 let myMaterial=new THREE.LineBasicMaterial({color:0x0000ff00});
 let myCurveLine=new THREE.Line(myGeometry,myMaterial);
 myScene.add(myCurveLine);
 //渲染阿基米德螺线
 myRenderer.render(myScene,myCamera);
</script></body>
</html>
