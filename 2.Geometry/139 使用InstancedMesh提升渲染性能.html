<html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>139 使用InstancedMesh提升渲染性能</h1>
  <center id="myContainer"></center>
<script>
 let myAmount=6;
 let myCount=Math.pow(myAmount,3);
 let myObject=new THREE.Object3D();
 //创建渲染器
 let myRenderer=new THREE.WebGLRenderer({antialias:true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myCamera=new THREE.PerspectiveCamera(60,
     window.innerWidth/window.innerHeight,0.1,100);
 myCamera.position.set(myAmount*0.9,myAmount*0.9,myAmount*0.9);
 myCamera.lookAt(0,0,0);
 let myScene=new THREE.Scene();
 myScene.background=new THREE.Color(0xffffff);
 //以实例化方式加载并创建模型
 let myMesh;
 let myLoader=new THREE.BufferGeometryLoader();
 myLoader.load('../Data/MySuzanne.json',function(geometry){
  geometry.computeVertexNormals();
  geometry.scale(0.5,0.5,0.5);
  let myMaterial=new THREE.MeshNormalMaterial();
  myMesh=new THREE.InstancedMesh(geometry,myMaterial,myCount); // 实例化模型
  myMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  myScene.add(myMesh);
 });
 //渲染实例化模型
 animate();
 function animate(){
  requestAnimationFrame(animate);
  if(myMesh){
   let myTime=Date.now()*0.001;
   myMesh.rotation.x=Math.sin(myTime/4);
   myMesh.rotation.y=Math.sin(myTime/2);
   let i=0;
   let myOffset=(myAmount-1)/2;
   for(let x=0;x<myAmount;x++){
    for(let y=0;y<myAmount;y++){
     for(let z=0;z<myAmount;z++){
      myObject.position.set(myOffset-x,myOffset-y,myOffset-z);
      myObject.rotation.y=(Math.sin(x/4+myTime)
          +Math.sin(y/4+myTime)+Math.sin(z/4+myTime));
      myObject.rotation.z=myObject.rotation.y*2;
      myObject.updateMatrix();
      myMesh.setMatrixAt(i++,myObject.matrix);
     }
    }
   }
   myMesh.instanceMatrix.needsUpdate=true;
  }
  myRenderer.render(myScene,myCamera);
 }
</script></body>
</html>
