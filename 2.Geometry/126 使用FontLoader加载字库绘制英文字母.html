<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>126 使用FontLoader加载字库绘制英文字母</h1>
  <center id="myContainer"></center>
<script type="text/javascript">
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene = new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera = new THREE.PerspectiveCamera(45,
     window.innerWidth / window.innerHeight, 0.1, 1000);
 myCamera.position.set(0, 40, 700);
 myScene.add(myCamera);
 //加载字库并绘制字母
 let myFontLoader = new THREE.FontLoader();
 myFontLoader.load('../Data/optimer_bold.typeface.json', function (font) {
  let myGeometry = new THREE.TextGeometry('three.js',{font: font, size: 160});
  //计算当前几何体的范围
  myGeometry.computeBoundingBox();
  //计算字母(几何体)当前中心的偏移量
  let myOffsetX = (myGeometry.boundingBox.max.x
      - myGeometry.boundingBox.min.x) / 2;
  let myOffsetY = (myGeometry.boundingBox.max.y
      - myGeometry.boundingBox.min.y) / 2;
  let myMaterial = new THREE.MeshBasicMaterial({color: 0x0000ff});
  let myTextMesh = new THREE.Mesh(myGeometry, myMaterial);
  myTextMesh.position.x = myGeometry.boundingBox.min.x - myOffsetX;
  myTextMesh.position.y = myGeometry.boundingBox.min.y + myOffsetY;
  myScene.add(myTextMesh);
 });
 //渲染绘制的字母
 animate();
 function animate() {
  requestAnimationFrame(animate);
  myCamera.lookAt(new THREE.Vector3(0, 150, 0));
  myRenderer.render(myScene, myCamera);
 }
</script></body>
</html>
