<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/Lensflare.js"></script>
 <script src="../ThreeJS/OrbitControls.js"></script>
</head>
<body>
  <h1>152 在场景中实现漂移的特殊光晕镜头</h1>
  <center id="myContainer" ></center>
<script>
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer({antialias: true });
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 myRenderer.setClearColor('black', 1.0);
 $("#myContainer").append(myRenderer.domElement);
 let myScene= new THREE.Scene();
 let myCamera = new THREE.PerspectiveCamera(45,
     window.innerWidth / window.innerHeight, 0.1, 1000);
 myCamera.position.set(400, -600, 100);
 myCamera.lookAt(new THREE.Vector3(-400, 600, -100));
 let myOrbitControls= new THREE.OrbitControls(myCamera);
 myOrbitControls.enableDamping = true;
 //是否自动旋转
 myOrbitControls.autoRotate = true;
 myOrbitControls.autoRotateSpeed = 2.5;
 //设置相机距离原点的最近距离
 myOrbitControls.minDistance  = 1;
 //设置相机距离原点的最远距离
 myOrbitControls.maxDistance  = 200;
 //是否开启右键拖拽
 myOrbitControls.enablePan = true;
 let myPointLight= new THREE.PointLight("#ffffff");
 myPointLight.position.set(-400, 600, -100);
 let myTextureLoader = new THREE.TextureLoader();
 let myMap1 = myTextureLoader.load("../images/lensflare0.png");
 let myMap2 = myTextureLoader.load("../images/lensflare2.png");
 let myMap3 = myTextureLoader.load("../images/lensflare3.png");
 let myFlareColor = new THREE.Color(0xffffff);
 myFlareColor.setHSL(0.55, 0.9, 1.0);
 let myLensFlare = new THREE.Lensflare(); // 创建一个镜头光晕
 myLensFlare.addElement(
     new THREE.LensflareElement(myMap1, 500, 0.0, myFlareColor) ); //添加一个光晕元素
// (texture, size, distance, color)
 myLensFlare.addElement( new THREE.LensflareElement(myMap2, 512, 0.0) );
 myLensFlare.addElement( new THREE.LensflareElement(myMap2, 512, 0.0) );
 myLensFlare.addElement( new THREE.LensflareElement(myMap2, 512, 0.0) );
 myLensFlare.addElement( new THREE.LensflareElement(myMap3, 60, 0.6) );
 myLensFlare.addElement( new THREE.LensflareElement(myMap3, 70, 0.7) );
 myLensFlare.addElement( new THREE.LensflareElement(myMap3, 120, 0.9) );
 myLensFlare.addElement( new THREE.LensflareElement(myMap3, 70, 1.0) );
 myLensFlare.position.copy(myPointLight.position);
 myScene.add(myLensFlare);
 //创建不可见的旋转中心
 let myPivot = new THREE.Object3D();
 myScene.add(myPivot);
 //创建圆球
 let mySphereGeometry=new THREE.SphereBufferGeometry(24,16,16 );
 let mySphereMaterial=new THREE.MeshNormalMaterial({wireframe: true,
  transparent: true} );
 let mySphereMesh=new THREE.Mesh(mySphereGeometry,mySphereMaterial);
 mySphereMesh.translateX(26);
 //将圆球与旋转中心合成一个整体
 myPivot.add( mySphereMesh);
 //渲染圆球与光晕
 animate();
 function animate() {
  myRenderer.render(myScene, myCamera);
  myOrbitControls.update();
  requestAnimationFrame(animate);
 }
</script></body></html>
