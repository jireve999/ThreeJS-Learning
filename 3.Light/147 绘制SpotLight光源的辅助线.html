<!DOCTYPE html><html><head><meta charset="UTF-8">
 <!-- <script src="http://threejs.org/build/three.js"></script>-->
 <!-- <script src="http://cdn.bootcss.com/jquery/3.4.1/jquery.js"></script>-->
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>147 绘制SpotLight光源的辅助线</h1>
  <div id="myContainer" ></div>
<script>
 let myRenderer= new THREE.WebGLRenderer({antialias: true });
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene = new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera = new THREE.PerspectiveCamera(75,
     window.innerWidth / window.innerHeight, 0.1, 1000);
 myCamera.position.set(179.70,84,146);
 myCamera.lookAt(new THREE.Vector3(0, 0, 0));
 myCamera.updateProjectionMatrix();
 //创建并添加聚光灯光源(THREE.SpotLight)
 let mySpotLight=new THREE.SpotLight('lightgreen');
 mySpotLight.position.set(0,100,100);
 myScene.add(mySpotLight);
 //绘制聚光灯光源辅助线
 let mySpotLightHelper=new THREE.SpotLightHelper(mySpotLight,'green');
 myScene.add(mySpotLightHelper);
 //创建立方体
 let myBoxGeometry = new THREE.BoxGeometry(50,50,50);
 let myMap = THREE.ImageUtils.loadTexture("../images/img002.jpg");
 let myMaterial = new THREE.MeshPhongMaterial({map: myMap});
 let myMesh = new THREE.Mesh(myBoxGeometry, myMaterial);
 myMesh.translateX(100);
 myScene.add(myMesh);
 //渲染立方体及光源辅助线
 animate();
 function animate() {
  requestAnimationFrame(animate);
  myMesh.rotation.x += 0.01;
  myMesh.rotation.y += 0.01;
  myMesh.rotation.z += 0.01;
  myRenderer.render(myScene, myCamera);
 };
</script></body>
</html>
