<!DOCTYPE html><html><head><meta charset="UTF-8">
 <!-- <script src="http://threejs.org/build/three.js"></script>-->
 <!-- <script src="http://cdn.bootcss.com/jquery/3.4.1/jquery.js"></script>-->
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>140 绘制DirectionalLight光源产生的阴影</h1>
  <div id="myContainer" ></div>
<script>
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer();
 myRenderer.setPixelRatio( window.devicePixelRatio );
 myRenderer.setSize(480,320);
 myRenderer.setClearColor('white', 1);
 //设置为true才能看到阴影
 myRenderer.shadowMap.enabled = true; // 表示渲染器支持阴影
 $("#myContainer").append(myRenderer.domElement);
 let myScene = new THREE.Scene();
 let myCamera=new THREE.PerspectiveCamera(45,480/320, 0.1, 1000);
 myCamera.position.set(4, 4, 2);
 myCamera.position.multiplyScalar(2);
 myCamera.lookAt(new THREE.Vector3(0, 0, 0));
 //创建DirectionalLight光源
 let myLight = new THREE.DirectionalLight('white', 1 );
 //设置为true才能看到阴影
 myLight.castShadow = true; // 表示光源支持阴影
 myLight.position.set( 0, 14, 0 );
 myScene.add( myLight );
 //创建用于投射阴影的球体
 let mySphereGeometry=new THREE.SphereBufferGeometry( 2,36,36 );
 let mySphereMaterial=new THREE.MeshNormalMaterial({wireframe: true,
  transparent: true} );
 let mySphereMesh=new THREE.Mesh(mySphereGeometry,mySphereMaterial);
 mySphereMesh.position.set(0, 2.5, 0);
 //设置为true才能看到阴影
 mySphereMesh.castShadow = true; // 表示物体支持阴影
 myScene.add( mySphereMesh );
 //创建(白色不可见)平面
 let myPlaneGeometry=new THREE.PlaneGeometry( 120, 120, 1, 1 );
 let myPlaneMaterial=new THREE.MeshStandardMaterial({color:'white'});
 let myPlaneMesh=new THREE.Mesh(myPlaneGeometry, myPlaneMaterial );
 myPlaneMesh.rotateX(-Math.PI/2 );
 myPlaneMesh.rotateZ(-Math.PI/7 );
 myPlaneMesh.position.set(0, -4.5, 0)
 //表示平面支持投射阴影
 myPlaneMesh.receiveShadow = true; 
 myScene.add(myPlaneMesh );
 //渲染球体和阴影
 myRenderer.render(myScene, myCamera);
</script></body>
</html>
