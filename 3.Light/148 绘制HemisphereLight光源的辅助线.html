<!DOCTYPE html><html><head><meta charset="UTF-8">
 <!-- <script src="http://threejs.org/build/three.js"></script>-->
 <!-- <script src="http://cdn.bootcss.com/jquery/3.4.1/jquery.js"></script>-->
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>148 绘制HemisphereLight光源的辅助线</h1>
  <div id="myContainer" ></div>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true });
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene = new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera = new THREE.PerspectiveCamera(75,
     window.innerWidth / window.innerHeight, 0.1, 1000);
 myCamera.position.set(-131.98,189.53,119.55);
 myCamera.lookAt(new THREE.Vector3(0, 0, 0));
 //创建并添加红蓝配置的半球光源
 //即指定接收自天空的颜色，接收自地面的颜色，及光照强度
 let myHemisphereLight = new THREE.HemisphereLight('red', 'blue', 1 );
 myHemisphereLight.position.set(0,-100,-100);
 myScene.add( myHemisphereLight );
 //绘制半球光源辅助线
 let myHemisphereLightHelper=
     new THREE.HemisphereLightHelper(myHemisphereLight,100,'red');
 myScene.add(myHemisphereLightHelper);
 //创建球体
 let myGeometry = new THREE.SphereGeometry(60, 40, 40);
 let myMap = THREE.ImageUtils.loadTexture("../images/img007.jpg");
 let myMaterial = new THREE.MeshPhongMaterial({map: myMap});
 let myMesh = new THREE.Mesh(myGeometry, myMaterial);
 myMesh.position.set(0,90,100);
 myScene.add(myMesh);
 //渲染图形
 animate();
 function animate() {
  requestAnimationFrame(animate);
  myMesh.rotation.x += 0.01;
  myMesh.rotation.y += 0.01;
  myMesh.rotation.z += 0.01;
  myRenderer.render(myScene, myCamera);
 };
</script></body>
</html>
