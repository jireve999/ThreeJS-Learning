<html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/OrbitControls.js"></script>
</head>
<body>
  <h1>181 在MeshPhongMaterial中使用裁剪平面</h1>
  <p><button id="myButton1">启用剪裁平面</button>
 <button id="myButton2">禁用剪裁平面</button></p>
<center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer({antialias: true,});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.localClippingEnabled=true;
 $("#myContainer").append(myRenderer.domElement);
 let myCamera=new THREE.PerspectiveCamera(36,
     window.innerWidth/window.innerHeight,0.1,1000);
 myCamera.position.set(10,10,60);
 let myScene=new THREE.Scene();
 myScene.background=new THREE.Color(0xffffff);
 let mySpotLight=new THREE.SpotLight(0xffffff);
 mySpotLight.angle=Math.PI/5;
 mySpotLight.position.set(20,30,30);
 myScene.add(mySpotLight);
 //创建圆环结
 let myGeometry=new THREE.TorusKnotBufferGeometry(10,2,200,80,2,5);
 //创建剪裁平面
 let myClippingPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),0.8);
 let myMaterial=new THREE.MeshPhongMaterial({color:0x80ee10,
  shininess:100, side:THREE.DoubleSide,clippingPlanes:[myClippingPlane]});
 let myMesh=new THREE.Mesh(myGeometry,myMaterial);
 myScene.add(myMesh);
 let myControls=new THREE.OrbitControls(myCamera,myContainer);
 //渲染圆环结
 animate();
 function animate(){
  requestAnimationFrame(animate);
  myMesh.rotation.x += 0.01;
  myMesh.rotation.y += 0.01;
  myMesh.rotation.z += 0.01;
  myRenderer.render(myScene,myCamera);
 }
 //响应单击“启用剪裁平面”按钮
 $("#myButton1").click(function(){
  myRenderer.localClippingEnabled=true;
 });
 //响应单击“禁用剪裁平面”按钮
 $("#myButton2").click(function(){
  myRenderer.localClippingEnabled=false;
 });
</script></body></html>
