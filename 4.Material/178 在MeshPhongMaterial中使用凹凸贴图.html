<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>178 在MeshPhongMaterial中使用凹凸贴图</h1>
  <div id="myContainer"></div>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true });
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myCamera = new THREE.PerspectiveCamera(75,
     window.innerWidth / window.innerHeight, 0.1, 1000);
 myCamera.position.set(0, 0, -50);
 myCamera.lookAt(new THREE.Vector3(0, 0, 0));
 let myScene = new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myAmbientLight = new THREE.AmbientLight(0x0c0c0c);
 myScene.add(myAmbientLight);
 let mySpotLight = new THREE.SpotLight(0xffffff);
 mySpotLight.position.set(-400, -400, -400);
 myScene.add(mySpotLight);
 //创建两个立方体
 let myGeometry = new THREE.BoxGeometry(26,26,26);
 let myMap=new THREE.TextureLoader().load('../images/img087.jpg');
 let myBumpMap=new THREE.TextureLoader().load('../images/img088.jpg');
 //根据凹凸贴图bumpMap创建THREE.MeshPhongMaterial材质
 let myMaterial1 = new THREE.MeshPhongMaterial();
 myMaterial1.map=myMap;
 //myMaterial1.normalMap=myBumpMap;
 myMaterial1.bumpMap=myBumpMap; // 使用凹凸贴图，一般使用一副灰度图
 myMaterial1.bumpScale = 2.2; // 设置凹凸贴图的缩放比例
 let myMesh1 = new THREE.Mesh(myGeometry, myMaterial1);
 myMesh1.translateX(20);
 myScene.add(myMesh1);
 //根据普通贴图创建THREE.MeshPhongMaterial材质
 let myMaterial2 = new THREE.MeshPhongMaterial();
 myMaterial2.map=myMap;
 let myMesh2 = new THREE.Mesh(myGeometry, myMaterial2);
 myMesh2.translateX(-20);
 myScene.add(myMesh2);
 //渲染两个立方体
 animate();
 function animate() {
  requestAnimationFrame(animate);
  myRenderer.render(myScene, myCamera);
 };
</script></body>
</html>
