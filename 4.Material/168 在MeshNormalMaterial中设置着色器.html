<html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/OrbitControls.js"></script>
 <script src="../ThreeJS/GLTFLoader.js"></script>
</head>
<body>
  <h1>168 在MeshNormalMaterial中设置着色器</h1>
  <center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,0.1,1000);
 myCamera.position.z=20;
 let myScene=new THREE.Scene();
 myScene.background=new THREE.Color(0xffffff);
 let myOrbitControls=new THREE.OrbitControls(myCamera);
 //加载头像模型
 let myGLTFLoader=new THREE.GLTFLoader();
 myGLTFLoader.load('../Data/MyLeePerrySmith.glb',function(gltf){
  let myGeometry=gltf.scene.children[0].geometry;
  let myMaterial=new THREE.MeshNormalMaterial();
  // 用于在自定义方法中自定义顶点着色器实现扭曲功能
  myMaterial.onBeforeCompile=function(shader){
   shader.uniforms.time={value:0};
   shader.vertexShader='uniform float time;\n'+shader.vertexShader;
   shader.vertexShader=shader.vertexShader.replace(
       '#include <begin_vertex>',
       [`float theta=cos(time+position.y)/2.0;`,
        'float c=cos(theta);',
        'float s=sin(theta);',
        'mat3 m=mat3(c,0,s,0,1,0,-s,0,c);',
        'vec3 transformed=vec3(position)*m;'].join('\n') );
   myMaterial.userData.shader=shader;
  };
  let myMesh=new THREE.Mesh(myGeometry,myMaterial);
  myMesh.scale.set(1.5,1.5,1.5);
  myScene.add(myMesh);
 });
 //渲染头像模型
 animate();
 function animate(){
  requestAnimationFrame(animate);
  myScene.traverse(function(child){
   if(child.isMesh){
    let myShader=child.material.userData.shader;
    if(myShader){
     myShader.uniforms.time.value=performance.now()/1000;
    }
   }
  });
  myRenderer.render(myScene,myCamera);
 }
</script></body></html>
