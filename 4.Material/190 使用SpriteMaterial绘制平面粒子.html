<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>190 使用SpriteMaterial绘制平面粒子</h1>
  <center id="myContainer"></center>
<script type="text/javascript">
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 myRenderer.setClearColor('white', 1.0);
 $('#myContainer')[0].appendChild(myRenderer.domElement);
 let myCamera =  new THREE.PerspectiveCamera(45,
     window.innerWidth / window.innerHeight, 1, 10000);
 myCamera.position.set(144.35, 68.22, 120.45);
 myCamera.lookAt(new THREE.Vector3(0, 0, 0));
 let myScene = new THREE.Scene();
 //绘制XYZ轴线
 let object = new THREE.AxesHelper(500);
 myScene.add(object);
 //在XY平面上添加多个粒子
 let mySpriteMaterial = new THREE.SpriteMaterial({color:0xff0000});
 for (let x = -5; x <= 5; x++) {
  for (let y = -5; y <= 5; y++) {
   let mySprite = new THREE.Sprite(mySpriteMaterial); //创建一个Sprite对象
   mySprite.position.set(x * 10, y * 10, 0); // 设置Sprite对象的位置
   myScene.add(mySprite);
  }
 }
 //渲染在XY平面上的多个粒子
 myRenderer.render(myScene,myCamera);
</script></body>
</html>
