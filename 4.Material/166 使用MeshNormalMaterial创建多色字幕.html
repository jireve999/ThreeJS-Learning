<!DOCTYPE html><html><head><meta charset="UTF-8">
 <!-- <script src="http://threejs.org/build/three.js"></script>-->
 <!-- <script src="http://cdn.bootcss.com/jquery/3.4.1/jquery.js"></script>-->
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>166 使用MeshNormalMaterial创建多色字幕</h1>
  <center id="myContainer"></center>
<script type="text/javascript">
 //创建渲染器
 let myRenderer=new THREE.WebGLRenderer({antialias:true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.setClearColor("white");
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,1,10000);
 myCamera.position.set(-24.39,85.19,384.14);
 myScene.add(myCamera);
 //创建字母
 let myFontLoader=new THREE.FontLoader();
 myFontLoader.load("../Data/gentilis_regular.typeface.json",function(myfont){
  let myGeometry=new THREE.TextBufferGeometry("luobin",
      {font:myfont,size:100,height:60});
  myGeometry.center();
  let myMaterial=new THREE.MeshNormalMaterial(); // 由于法向量网格材质的颜色与当前表面的角度相关，因此处于不同角度的平面就会呈现不同的颜色
  let myMesh=new THREE.Mesh(myGeometry,myMaterial);
  myMesh.position.y=100;
  myScene.add(myMesh);
 });
 //渲染字母
 animate();
 function animate(){
  requestAnimationFrame(animate);
  myRenderer.render(myScene, myCamera);
 }
</script></body>
</html>
