<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>169 扁平化MeshNormalMaterial创建的球体</h1>
  <p><button id="myButton1">扁平化显示球体</button>
 <button id="myButton2">正常显示球体</button></p>
<div id="myContainer" ></div>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene = new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera = new THREE.PerspectiveCamera(75,
     window.innerWidth / window.innerHeight, 0.1, 1000);
 myCamera.position.set(100.23,98.92,39.18);
 myCamera.lookAt(new THREE.Vector3(0, 0, 0));
 //渲染球体
 animate();
 function animate() {
  requestAnimationFrame(animate);
  myRenderer.render(myScene,myCamera);
 }
 //响应单击“扁平化显示球体”按钮
 $("#myButton1").click(function () {
  myScene.remove(myScene.getObjectByName('flatShadingFalse'));
  let myGeometry = new THREE.SphereGeometry(80, 30, 30); // (80,300,300)切片数量过大则几乎看不到扁平化效果
  //创建法向量材质
  let myMaterial = new THREE.MeshNormalMaterial();
  //扁平化球面
  myMaterial.flatShading=true;
  let myMesh = new THREE.Mesh(myGeometry, myMaterial);
  myMesh.name='flatShadingTrue';
  myScene.add(myMesh);
 });
 //响应单击“正常显示球体”按钮
 $("#myButton2").click(function () {
  myScene.remove(myScene.getObjectByName('flatShadingTrue'));
  let myGeometry = new THREE.SphereGeometry(80, 30, 30);
  let myMaterial = new THREE.MeshNormalMaterial();
  let myMesh = new THREE.Mesh(myGeometry, myMaterial);
  myMesh.name='flatShadingFalse';
  myScene.add(myMesh);
 });
</script></body>
</html>
