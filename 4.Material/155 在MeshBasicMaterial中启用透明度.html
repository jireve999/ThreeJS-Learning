<html><head> <meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/OrbitControls.js"></script>
</head>
<body>
  <h1>155 在MeshBasicMaterial中启用透明度</h1>
  <p><button id="myButton1">启用半透明效果</button>
 <button id="myButton2">禁用半透明效果</button></p>
<center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene = new THREE.Scene();
 myScene.background = new THREE.Color('white');
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,0.1,1000);
 myCamera.position.set(209.88,80.3,-97.5);
 myScene.add(myCamera);
 let myControls=new THREE.OrbitControls(myCamera);
 //创建球体
 let myGeometry=new THREE.SphereGeometry(80,80,80);
 let myTexture=THREE.ImageUtils.loadTexture("../images/img139.jpg");
 let myMaterial=new THREE.MeshBasicMaterial({map:myTexture});
 let mySphere=new THREE.Mesh(myGeometry,myMaterial);
 myScene.add(mySphere);
 //渲染球体
 animate();
 function animate(){
  myRenderer.render(myScene,myCamera);
  requestAnimationFrame(animate);
 }
 //响应单击“启用半透明效果”按钮
 $("#myButton1").click(function(){
  myScene.remove(mySphere);
  //使用opacity参数设置(不)透明度，范围在0-1
  myMaterial=new THREE.MeshBasicMaterial({
   map:myTexture,transparent:true,opacity:0.5});
  mySphere=new THREE.Mesh(myGeometry,myMaterial);
  myScene.add(mySphere);
 });
 //响应单击“禁用半透明效果”按钮
 $("#myButton2").click(function(){
  myScene.remove(mySphere);
  myMaterial=new THREE.MeshBasicMaterial({map:myTexture});
  mySphere=new THREE.Mesh(myGeometry,myMaterial);
  myScene.add(mySphere);
 });
</script></body></html>
