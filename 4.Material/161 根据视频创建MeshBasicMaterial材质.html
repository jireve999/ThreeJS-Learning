<html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>161 根据视频创建MeshBasicMaterial材质</h1>
  <p><button id="myButton1">开始播放视频</button>
 <button id="myButton2">暂停播放视频</button></p>
<center id="myContainer"></center>
<video id="myVideo" loop muted style="display:none"
       source src="../images/video01.mp4"></video>
<script>
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer({antialias: true });
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 myRenderer.setClearColor('white', 1.0);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,0.1,1000);
 myCamera.position.set(19.45,4.12,205.95);
 myCamera.lookAt(myScene.position);
 let myGeometry=new THREE.PlaneBufferGeometry(300,200,5,5);
 //根据指定视频创建纹理贴图
 let myVideoMap=new THREE.VideoTexture($("#myVideo")[0]);
 //在视频加载完成后自动播放
 $("#myVideo")[0].play();
 //根据视频纹理贴图创建MeshBasicMaterial
 let myVideoMaterial=new THREE.MeshBasicMaterial({map:myVideoMap});
 //根据视频材质创建平面图形
 let myVideoPlane=new THREE.Mesh(myGeometry,myVideoMaterial);
 myScene.add(myVideoPlane);
 //渲染视频纹理平面图形
 animate();
 function animate(){
  requestAnimationFrame(animate);
  myRenderer.render(myScene,myCamera);
 }
 //响应单击“开始播放视频”按钮
 $("#myButton1").click(function(){
  $("#myVideo")[0].play();
 });
 //响应单击“暂停播放视频”按钮
 $("#myButton2").click(function(){
  $("#myVideo")[0].pause();
 });
</script></body>
</html>
