<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/OrbitControls.js"></script>
</head>
<body>
  <h1>188 在MeshLambertMaterial中实现形变动画</h1>
  <p><button id="myButton1">在z轴方向上压缩图形</button>
 <button id="myButton2">在z轴方向上拉伸图形</button></p>
<center id="myContainer"></center>
<script>
 let isReversed,myStep=0;
 //创建渲染器
 let myRenderer = new THREE.WebGLRenderer({antialias: true,});
 myRenderer.setSize( window.innerWidth,window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 myScene.background=new THREE.Color(0xffffff);
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,0.1,1000);
 myCamera.position.x=3.25;
 myCamera.position.y=-2.52;
 myCamera.position.z=4.41;
 myScene.add(myCamera);
 myCamera.add(new THREE.PointLight(0xffffff,1));
 let myControls=new THREE.OrbitControls(myCamera);
 //创建立方体
 let myGeometry=new THREE.BoxBufferGeometry(2.4,2.4,2.4,32,32,32);
 //自定义立方体在压缩(或拉伸)前后的顶点位置(形变属性)
 myGeometry.morphAttributes.position=[];
 let myOldPosition=myGeometry.attributes.position.array;
 let myNewPosition=[];
 for (let i=0;i<myOldPosition.length;i+=3){
  let x=myOldPosition[i];
  let y=myOldPosition[i+1];
  let z=myOldPosition[i+2];
  myNewPosition.push(x,y,0); //压缩
 }
 myGeometry.morphAttributes.position[0]=
     new THREE.Float32BufferAttribute(myNewPosition,3);
 let myMaterial=new THREE.MeshLambertMaterial({
  color:0x00ff00,flatShading:true,morphTargets:true});
 let myBoxMesh=new THREE.Mesh(myGeometry,myMaterial);
 myScene.add(myBoxMesh);
 //动态拉伸或压缩立方体
 myRenderer.setAnimationLoop(function(){
  if(myStep<1){ if(!isReversed) myStep+=0.02; }
  if(myStep>0){ if(isReversed) myStep-=0.02; }
  myBoxMesh.morphTargetInfluences[0]=myStep;
  myRenderer.render(myScene,myCamera);
 });
 //响应单击“在z轴方向上压缩图形”按钮
 $("#myButton1").click(function(){
  isReversed=false;
  myStep=0;
 });
 //响应单击“在z轴方向上拉伸图形”按钮
 $("#myButton2").click(function(){
  isReversed=true;
  myStep=1;
 });
</script></body></html>
