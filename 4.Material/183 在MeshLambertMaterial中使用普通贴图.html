<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>183 在MeshLambertMaterial中使用普通贴图</h1>
  <center id="myContainer" ></center>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.setClearColor('white', 1.0);
 $("#myContainer").append(myRenderer.domElement);
 let myCamera = new THREE.PerspectiveCamera(45,
     window.innerWidth / window.innerHeight, 0.1, 1000);
 myCamera.position.set(35.9,-35.58,32.97);
 myCamera.lookAt(new THREE.Vector3(0, 0, 0));
 let myScene = new THREE.Scene();
 myScene.add(new THREE.AmbientLight('white'));
 //创建立方体
 let myTextureLoader = new THREE.TextureLoader();
 myTextureLoader.load( '../images/img053.jpg',function (myTexture){
  let myMeshLambertMaterial=new THREE.MeshLambertMaterial({map: myTexture}); // 材质
  let myGeometry= new THREE.BoxGeometry(24, 24, 24);
  let myMesh = new THREE.Mesh(myGeometry, myMeshLambertMaterial);
  myScene.add( myMesh );
 });
 //渲染立方体
 animate();
 function animate() {
  requestAnimationFrame(animate); //循环调用函数
  myRenderer.render(myScene, myCamera);
 };
</script></body>
</html>
