<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>200 使用PointsMaterial创建粒子波动动画</h1>
  <p><button id="myButton1">执行粒子波动动画</button>
 <button id="myButton2">暂停粒子波动动画</button></p>
<canvas id="myCanvas" style="position:fixed;left:0px;top:0px;
                       width:100%;height:100%; z-index:-1;"></canvas>
<div id="myView" style="width:500px;height:300px"></div>
<script>
 //判断是否执行粒子波动动画
 let isAnimate=true,mySize=10;
 //创建渲染器
 let myRenderer=new THREE.WebGLRenderer({canvas:$("#myCanvas")[0]});
 myRenderer.setSize($("#myCanvas").width(),$("#myCanvas").height());
 let myRect=$("#myView")[0].getBoundingClientRect();
 let myWidth=myRect.right-myRect.left;
 let myHeight=myRect.bottom-myRect.top;
 let myLeft=myRect.left;
 let myBottom=myRenderer.domElement.clientHeight-myRect.bottom;
 myRenderer.setViewport(myLeft,myBottom,myWidth,myHeight);
 myRenderer.setScissor(myLeft,myBottom,myWidth,myHeight);
 let myCamera=new THREE.PerspectiveCamera(75,1,0.1,100);
 myCamera.position.set(0,0,1.2*mySize);
 let myScene=new THREE.Scene();
 myScene.background=new THREE.Color(0xffffff);
 //设置粒子群的每个粒子的坐标
 let myVertices=[];
 for(let i=0;i<Math.pow(mySize,3);i++){
  let x=mySize*Math.random()-mySize/2;
  let y=mySize*Math.random()-mySize/2;
  let z=mySize*Math.random()-mySize/2;
  myVertices.push(x,y,z);
 }
 //创建粒子群
 let myGeometry=new THREE.BufferGeometry();
 let myCopyGeometry=new THREE.BufferGeometry();
 myGeometry.setAttribute('position',
     new THREE.Float32BufferAttribute(myVertices,3));
 myCopyGeometry.setAttribute('position',
     new THREE.Float32BufferAttribute(myVertices,3));
 let myMaterial=new THREE.PointsMaterial({size:0.25,color:0x0000ff});
 let myPoints=new THREE.Points(myGeometry,myMaterial);
 myScene.add(myPoints);
 //渲染粒子群
 let myTime=0;
 animate();
 function animate(){
  myRenderer.render(myScene,myCamera);
  //var myPoints=myScene.children[0];
  let myPosition=myPoints.geometry.attributes.position; //获取粒子群的顶点位置属性
  let myPoint=new THREE.Vector3();
  let myOffset=new THREE.Vector3();
  for(let i=0;i<myPosition.count;i++){
   myPoint.fromBufferAttribute(myCopyGeometry.attributes.position,i);
   let myRadius=Math.sqrt(myPoint.x*myPoint.x
       +myPoint.y*myPoint.y+myPoint.z*myPoint.z);
   let myTheta=Math.acos(myPoint.z/myRadius);
   let myPhi=Math.atan2(myPoint.y,myPoint.x);
   let myNewX=3*Math.cos(myPhi)*Math.sin(myTheta)
       *Math.sin(myRadius-myTime/5) /myRadius;
   let myNewY=3*Math.sin(myPhi)*Math.sin(myTheta)
       *Math.sin(myRadius-myTime/5) /myRadius;
   let myNewZ=3*Math.cos(myTheta)*Math.sin(myRadius-myTime/5)/myRadius ;
   myOffset.set(myNewX,myNewY,myNewZ);
   //重新设置粒子顶点坐标，实现波动效果
   myPosition.setXYZ(i,myPoint.x+myOffset.x,
       myPoint.y+myOffset.y,myPoint.z+myOffset.z);
   // let myX=mySize*Math.random()-mySize/2;
   // let myY=mySize*Math.random()-mySize/2;
   // let myZ=mySize*Math.random()-mySize/2;
   // myPosition.setXYZ(i,myX+myOffset.x,myY+myOffset.y,myZ+myOffset.z);
  }
  myPosition.needsUpdate=true;
  if(isAnimate) myTime++;
  requestAnimationFrame(animate);
 }
 //响应单击“执行粒子波动动画”按钮
 $("#myButton1").click(function(){isAnimate=true;});
 //响应单击“暂停粒子波动动画”按钮
 $("#myButton2").click(function(){isAnimate=false;});
</script></body>
</html>
