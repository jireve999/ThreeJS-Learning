<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/PCDLoader.js"></script>
 <script src="../ThreeJS/TrackballControls.js"></script>
</head>
<body>
  <h1>266 使用PCDLoader加载PDC模型</h1>
  <p><button id="myButton1">加载PCD模型</button>
 <button id="myButton2">移除PCD模型</button></p>
<center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer=new THREE.WebGLRenderer({antialias:true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.setPixelRatio(window.devicePixelRatio);
 myRenderer.setClearColor('white', 1);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,0.1,5000);
 myCamera.position.set(0.2,0.5,-0.01);
 myCamera.up.y=-1;
 myScene.add(new THREE.AmbientLight(0xcccccc));
 let myDirectionalLight=new THREE.DirectionalLight(0xffffff);
 myDirectionalLight.position.set(0,20,40);
 myScene.add(myDirectionalLight);
 let myTrackballControls=
     new THREE.TrackballControls(myCamera,myRenderer.domElement);
 //渲染PCD模型
 animate();
 function animate() {
  myTrackballControls.update();
  myRenderer.render(myScene, myCamera);
  requestAnimationFrame(animate);
 }
 //响应单击“加载PCD模型”按钮
 $("#myButton1").click(function(){
  let myPCDLoader=new THREE.PCDLoader();
  myPCDLoader.load('../Data/MyZaghetto.pcd',function(myPCD){
   myPCD.material.color.set(Math.random() * 0xffffff);
   myPCD.name='myPCD';
   myScene.add(myPCD);
   let myCenter=myPCD.geometry.boundingSphere.center;
   myTrackballControls.target.set(myCenter.x,myCenter.y,myCenter.z); //设置摄像机目标点
  });
 });
 //响应单击“移除PCD模型”按钮
 $("#myButton2").click(function(){
  myScene.remove( myScene.getObjectByName('myPCD'));
 });
</script></body></html>
