<html><head> <meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/DDSLoader.js"></script>
</head>
<body>
  <h1>275 使用DDSLoader加载DDS图像文件</h1>
  <div id="myContainer"></div>
<script>
 //创建渲染器
 let myRenderer=new THREE.WebGLRenderer();
 myRenderer.setClearColor(new THREE.Color(0xffffff,1.0));
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.shadowMapEnabled=true;
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 myScene.background=new THREE.Color(0xffffff);
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,0.1,1000);
 myCamera.position.x=0;
 myCamera.position.y=12;
 myCamera.position.z=28;
 myCamera.lookAt(new THREE.Vector3(0,0,0));
 myScene.add(new THREE.AmbientLight(0x141414));
 let myLight=new THREE.DirectionalLight();
 myLight.position.set(0,30,20);
 myScene.add(myLight);
 //加载DDS文件
 let myDDSLoader=new THREE.DDSLoader();
 let myMap=myDDSLoader.load('../Data/mySeafloor.dds');
 let myMaterial=new THREE.MeshPhongMaterial();
 myMaterial.map=myMap;
 //创建立方体
 let myBoxGeometry=new THREE.BoxGeometry(10,10,10);
 let myBoxMesh=new THREE.Mesh(myBoxGeometry,myMaterial);
 myBoxMesh.position.x=-8;
 myScene.add(myBoxMesh);
 //创建二十面体
 let myIcosahedronGeometry=new THREE.IcosahedronGeometry(8,0);
 let myIcosahedronMesh=new THREE.Mesh(myIcosahedronGeometry,myMaterial);
 myIcosahedronMesh.position.x=10;
 myScene.add(myIcosahedronMesh);
 //渲染立方体和二十面体
 let step=0;
 animate();
 function animate(){
  myIcosahedronMesh.rotation.y=step+=0.01;
  myIcosahedronMesh.rotation.x=step;
  myBoxMesh.rotation.y=step;
  myBoxMesh.rotation.x=step;
  requestAnimationFrame(animate);
  myRenderer.render(myScene, myCamera);
 }
</script></body></html>
