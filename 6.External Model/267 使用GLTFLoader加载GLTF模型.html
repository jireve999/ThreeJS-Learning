<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/GLTFLoader.js"></script>
 <script src="../ThreeJS/OrbitControls.js"></script>
</head>
<body>
  <h1>267 使用GLTFLoader加载GLTF模型</h1>
  <p><button id="myButton1">加载GLTF模型</button>
 <button id="myButton2">移除GLTF模型</button></p>
<center id="myContainer" ></center>
<script>
 //创建渲染器
 let myRenderer=new THREE.WebGLRenderer({antialias:true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.setPixelRatio(window.devicePixelRatio);
 myRenderer.setClearColor('white',1);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,0.1,5000);
 myCamera.position.set(0,10,100);
 myScene.add(new THREE.AmbientLight(0xcccccc));
 let myDirectionalLight=new THREE.DirectionalLight(0xffffff);
 myDirectionalLight.position.set(0,20,40);
 myScene.add(myDirectionalLight);
 //渲染GLTF模型
 animate();
 function animate() {
  myRenderer.render(myScene, myCamera);
  requestAnimationFrame(animate);
 }
 //响应单击“加载GLTF模型”按钮
 $("#myButton1").click(function(){
  let myGLTFLoader=new THREE.GLTFLoader();
  myGLTFLoader.load('../Data/MyDamagedHelmet.gltf',function(object){
   let myObject=object.scene.children[0];
   myObject.scale.set(30,30,30);
   myObject.position.y=6;
   myObject.name='myGLTF';
   myScene.add(myObject);
  });
 });
 //响应单击“移除GLTF模型”按钮
 $("#myButton2").click(function(){
  myScene.remove( myScene.getObjectByName('myGLTF'));
 });
 let myOrbitControls = new THREE.OrbitControls(myCamera);
</script></body></html>
