<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/Projector.js"></script>
 <script src="../ThreeJS/SVGRenderer.js"></script>
</head>
<body>
  <h1>260 使用FileLoader加载SVG模型</h1>
  <p><button id="myButton1">加载SVG模型</button>
 <button id="myButton2">移除SVG模型</button></p>
<center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer=new THREE.SVGRenderer();
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myCamera=new THREE.PerspectiveCamera(75,
     window.innerWidth/window.innerHeight,1,1000);
 myCamera.position.z=800;
 let myScene=new THREE.Scene();
 myScene.background=new THREE.Color(0xffffff);
 //渲染SVG模型
 animate();
 function animate(){
  requestAnimationFrame(animate);
  myRenderer.render(myScene,myCamera);
 }
 //响应单击“加载SVG模型”按钮
 $("#myButton1").click(function () {
  let myFileLoader=new THREE.FileLoader();
  myFileLoader.load('../Data/MyTiger.svg',function(svg){
   let myNode=document.createElementNS('http://www.w3.org/2000/svg','g');
   let myDOMParser=new DOMParser();
   let myDocument=myDOMParser.parseFromString(svg,'image/svg+xml');
   myNode.appendChild( myDocument.documentElement);
   let myObject=new THREE.SVGObject(myNode);
   myObject.name='mySVG';
   myObject.position.x=-660;
   myObject.position.y=700;
   myScene.add(myObject);
  });
 });
 //响应单击“移除SVG模型”按钮
 $("#myButton2").click(function () {
  myScene.remove(myScene.getObjectByName('mySVG'));
 });
</script></body></html>
