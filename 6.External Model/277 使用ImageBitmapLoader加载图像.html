<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
</head>
<body>
  <h1>277 使用ImageBitmapLoader加载图像</h1>
  <center id="myContainer"></center>
<script>
 let myClock=new THREE.Clock();
 //创建渲染器
 let myRenderer=new THREE.WebGLRenderer({antialias:true});
 myRenderer.setPixelRatio(window.devicePixelRatio);
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 $("#myContainer").append(myRenderer.domElement);
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,1,1000);
 myCamera.position.set(0,260,300);
 myCamera.lookAt(new THREE.Vector3(0,0,0));
 let myScene=new THREE.Scene();
 myScene.background=new THREE.Color('white');
 myScene.add(new THREE.AmbientLight(0xffffff));
 //创建球体(地球)
 let myMesh;
 let myGeometry=new THREE.SphereBufferGeometry(120, 64, 64);
 //创建材质(普通贴图)
 // let myMap = new THREE.TextureLoader().load("images/img007.png");
 // let myMaterial = new THREE.MeshPhongMaterial({map: myMap});
 // myMesh = new THREE.Mesh(myGeometry, myMaterial);
 // myScene.add(myMesh);
 let myImageBitmapLoader=new THREE.ImageBitmapLoader();
 myImageBitmapLoader.setOptions({imageOrientation:'flipY'});
 myImageBitmapLoader.load('../images/img007.png',function(imageBitmap){
  let myTexture=new THREE.CanvasTexture(imageBitmap);
  let myMaterial=new THREE.MeshBasicMaterial({
   map:myTexture,side:THREE.DoubleSide});
  myMesh=new THREE.Mesh(myGeometry,myMaterial);
  myScene.add(myMesh);
 });
 //渲染球体(地球)
 animate();
 function animate(){
  requestAnimationFrame(animate);
  let delta=myClock.getDelta();
  //按照设置的角度增量实现绕y轴旋转地球
  myMesh.rotation.y+=delta/5;
  myRenderer.render(myScene,myCamera);
 }
</script></body>
</html>
