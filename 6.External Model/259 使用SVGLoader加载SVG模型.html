<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/SVGLoader.js"></script>
</head>
<body>
  <h1>259 使用SVGLoader加载SVG模型</h1>
  <p><button id="myButton1">加载SVG模型</button>
 <button id="myButton2">移除SVG模型</button></p>
<center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer=new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth, window.innerHeight);
 myRenderer.setPixelRatio(window.devicePixelRatio);
 myRenderer.setClearColor('white', 1);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,0.1,5000);
 myCamera.position.set(0,0,500);
 //渲染在场景中的SVG模型
 animate();
 function animate(){
  myRenderer.render(myScene,myCamera);
  requestAnimationFrame(animate);
 }
 //响应单击“加载SVG模型”按钮
 $("#myButton1").click(function(){
  let myLoader=new THREE.SVGLoader();
  myLoader.load('../Data/MyTiger.svg',function(data){
   let myPaths=data.paths;
   let myGroup=new THREE.Group();
   //设置模型缩放倍数和所在位置
   myGroup.scale.multiplyScalar(0.75);
   myGroup.position.x=-200;
   myGroup.position.y=200;
   myGroup.scale.y *=-1;
   myPaths.forEach(function(item, index){
   let myPath=item;
   let myFillColor=myPath.userData.style.fill;
   if (myFillColor&&myFillColor!=='none'){
    let myMaterial=new THREE.MeshBasicMaterial({
     color:new THREE.Color().setStyle(myFillColor),
     opacity:myPath.userData.style.fillOpacity,
     transparent:myPath.userData.style.fillOpacity<1,
     side:THREE.DoubleSide,
     depthWrite:false,
     wireframe:false
    });
     let myShapes=myPath.toShapes(true);
     for (let j=0;j<myShapes.length;j++){
      let myShape=myShapes[j];
      let myGeometry=new THREE.ShapeBufferGeometry(myShape);
      let myMesh=new THREE.Mesh(myGeometry,myMaterial);
      myGroup.add(myMesh);
     }
    }
    let myStrokeColor=myPath.userData.style.stroke;
    if (myStrokeColor&&myStrokeColor!=='none'){
     let myMaterial=new THREE.MeshBasicMaterial({
      color:new THREE.Color().setStyle(myStrokeColor),
      opacity:myPath.userData.style.strokeOpacity,
      transparent:myPath.userData.style.strokeOpacity<1,
      side:THREE.DoubleSide,depthWrite:false,wireframe:false});
     for(let j=0, jl=myPath.subPaths.length; j<jl;j++){
      let mySubPath=myPath.subPaths[j];
      let myGeometry=THREE.SVGLoader.pointsToStroke(mySubPath.getPoints(),
          myPath.userData.style);
      if(myGeometry){
       let myMesh=new THREE.Mesh(myGeometry, myMaterial);
       myGroup.add(myMesh);
      } } } });
   myGroup.name='mySVG';
   myScene.add(myGroup);
  });
 });
 //响应单击“移除SVG模型”按钮
 $("#myButton2").click(function(){
  myScene.remove(myScene.getObjectByName('mySVG'));
 });
</script></body></html>
