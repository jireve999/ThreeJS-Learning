<!DOCTYPE html><html><head><meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/TGALoader.js"></script>
 <script src="../ThreeJS/TrackballControls.js"></script>
</head>
<body>
  <h1>276 使用TGALoader加载TGA图像文件</h1>
  <p><button id="myButton1">加载TGA纹理</button>
 <button id="myButton2">移除TGA纹理</button></p>
<center id="myContainer"></center>
<script>
 //创建渲染器
 let myRenderer=new THREE.WebGLRenderer({antialias:true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.setPixelRatio(window.devicePixelRatio);
 myRenderer.setClearColor('white',1);
 $("#myContainer").append(myRenderer.domElement);
 let myScene=new THREE.Scene();
 let myCamera=new THREE.PerspectiveCamera(45,
     window.innerWidth/window.innerHeight,0.1,1000);
 myCamera.position.set(-30,30,40);
 myScene.add(myCamera);
 let mySpotLight=new THREE.SpotLight(0xffffff);
 mySpotLight.position.set(-50,80,70);
 myScene.add(mySpotLight);
 myScene.add(new THREE.AmbientLight(0xdddddd,0.5));
 let myTrackballControls=
     new THREE.TrackballControls(myCamera,myRenderer.domElement);
 //渲染立方体
 animate();
 function animate(){
  myTrackballControls.update();
  myRenderer.render(myScene, myCamera);
  requestAnimationFrame(animate);
 }
 //响应单击“加载TGA纹理”按钮
 $("#myButton1").click(function(){
  let myTGALoader=new THREE.TGALoader();
  let myTexture=myTGALoader.load('../Data/MyCrate.tga');
  //初始化立方体，并设置其长、宽、高
  let myGeometry=new THREE.BoxBufferGeometry(20,20,20);
  //初始化材质对象，并传入纹理贴图和颜色参数
  let myMaterial=new THREE.MeshPhongMaterial({
   map:myTexture,color:0xffffff });
  let myBoxMesh=new THREE.Mesh(myGeometry,myMaterial);
  myBoxMesh.name='myTGA';
  myBoxMesh.scale.multiplyScalar(1.25);
  myScene.add(myBoxMesh);
 });
 //响应单击“移除TGA纹理”按钮
 $("#myButton2").click(function(){
  myScene.remove( myScene.getObjectByName('myTGA'));
 });
</script></body></html>
