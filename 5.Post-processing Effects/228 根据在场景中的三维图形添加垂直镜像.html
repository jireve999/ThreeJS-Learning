<html><head> <meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/EffectComposer.js"></script>
 <script src="../ThreeJS/RenderPass.js"></script>
 <script src="../ThreeJS/ShaderPass.js"></script>
 <script src="../ThreeJS/MirrorShader.js"></script>
</head>
<body>
  <h1>228 根据在场景中的三维图形添加垂直镜像</h1>
  <p><button id="myButton1">添加垂直镜像</button>
 <button id="myButton2">保持原状</button></p>
<div id="myContainer"></div>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.setClearColor('white', 1.0);
 $("#myContainer").append(myRenderer.domElement);
 //创建相机
 let myCamera = new THREE.PerspectiveCamera(45,
     window.innerWidth / window.innerHeight, 0.1, 1000);
 myCamera.position.set(10,30,50);
 myCamera.lookAt(new THREE.Vector3(0, 0, 0));
 let myScene = new THREE.Scene();
 //创建球体
 let mySphereGeometry =new THREE.SphereGeometry(8, 120, 120);
 let mySphereMaterial =new THREE.MeshNormalMaterial();
 let mySphereMesh = new THREE.Mesh(mySphereGeometry, mySphereMaterial);
 mySphereMesh.position.x=-10;
 mySphereMesh.position.y=12;
 myScene.add(mySphereMesh);
 //创建圆环结
 let myKnotGeometry = new THREE.TorusKnotGeometry(5,2, 100, 28);
 let myKnotMaterial = new THREE.MeshNormalMaterial();
 let myKnotMesh = new THREE.Mesh(myKnotGeometry, myKnotMaterial);
 myKnotMesh.position.x=10;
 myKnotMesh.position.y=12;
 myScene.add(myKnotMesh);
 //在场景中实现后期特效(为所有图形添加垂直镜像)
 let myEffectComposer=new THREE.EffectComposer(myRenderer);
 myEffectComposer.addPass(new THREE.RenderPass(myScene,myCamera));
 let myShaderPass=new THREE.ShaderPass(THREE.MirrorShader);
 myShaderPass.uniforms['side'].value=2; // 垂直镜像
 myEffectComposer.addPass(myShaderPass);
 //动态渲染在添加垂直镜像之后的球体和圆环结
 animate();
 function animate() {
  myEffectComposer.render();
  requestAnimationFrame(animate);
 }
 //响应单击“添加垂直镜像”按钮
 $("#myButton1").click(function () {
  myEffectComposer.addPass(myShaderPass);
 });
 //响应单击“保持原状”按钮
 $("#myButton2").click(function () {
  myEffectComposer.addPass(new THREE.RenderPass(myScene,myCamera));
 });
</script></body></html>
