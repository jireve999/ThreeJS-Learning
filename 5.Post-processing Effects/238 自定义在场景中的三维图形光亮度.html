<html><head> <meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/EffectComposer.js"></script>
 <script src="../ThreeJS/RenderPass.js"></script>
 <script src="../ThreeJS/ShaderPass.js"></script>
 <script src="../ThreeJS/LuminosityShader.js"></script>
</head>
<body>
  <h1>238 自定义在场景中的三维图形光亮度</h1>
  <p><button id="myButton1">改变光亮</button>
 <button id="myButton2">保持原状</button></p>
<div id="myContainer"></div>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.setClearColor('white', 1.0);
 $("#myContainer").append(myRenderer.domElement);
 let myCamera = new THREE.PerspectiveCamera(45,
     window.innerWidth / window.innerHeight, 0.1, 1000);
 myCamera.position.set(71,121,44);
 myCamera.lookAt(new THREE.Vector3(0, 0, 0));
 let myScene = new THREE.Scene();
 //创建立方体
 let myGeometry = new THREE.BoxGeometry(50,50,50);
 let myMap = THREE.ImageUtils.loadTexture("../images/img076.jpg");
 let myMaterial = new THREE.MeshBasicMaterial({map: myMap});
 let myMesh = new THREE.Mesh(myGeometry, myMaterial);
 myMesh.position.y=10;
 myScene.add(myMesh);
 //在场景中实现后期特效(改变所有图形的光亮)
 let myEffectComposer=new THREE.EffectComposer(myRenderer);
 myEffectComposer.addPass(new THREE.RenderPass(myScene,myCamera));
 let myShaderPass=new THREE.ShaderPass(THREE.LuminosityShader); //创建光亮改变效果
 myEffectComposer.addPass(myShaderPass);
 //渲染光亮改变之后的立方体
 animate();
 function animate() {
  requestAnimationFrame(animate);
  myEffectComposer.render();
 }
 //响应单击“改变光亮”按钮
 $("#myButton1").click(function(){
  myEffectComposer.addPass(myShaderPass);
 });
 //响应单击“保持原状”按钮
 $("#myButton2").click(function(){
  myEffectComposer.addPass(new THREE.RenderPass(myScene,myCamera));
 });
</script></body></html>
