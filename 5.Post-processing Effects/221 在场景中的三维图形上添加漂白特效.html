<html><head> <meta charset="UTF-8">
 <script src="../ThreeJS/three.js"></script>
 <script src="../ThreeJS/jquery.js"></script>
 <script src="../ThreeJS/EffectComposer.js"></script>
 <script src="../ThreeJS/RenderPass.js"></script>
 <script src="../ThreeJS/ShaderPass.js"></script>
 <script src="../ThreeJS/BleachBypassShader.js"></script>
 <script src="../ThreeJS/OrbitControls.js"></script>
</head>
<body>
  <h1>221 在场景中的三维图形上添加漂白特效</h1>
  <p><button id="myButton1">轻微漂白图形</button>
 <button id="myButton2">强力漂白图形</button></p>
<div id="myContainer"></div>
<script>
 //创建渲染器
 let myRenderer= new THREE.WebGLRenderer({antialias: true});
 myRenderer.setSize(window.innerWidth,window.innerHeight);
 myRenderer.setClearColor(0x000);
 $("#myContainer").append(myRenderer.domElement);
 let myCamera = new THREE.PerspectiveCamera(45,
     window.innerWidth / window.innerHeight, 0.1, 1000);
 myCamera.position.set(-80, 90, 100);
 let myScene = new THREE.Scene();
 myScene.add(new THREE.AmbientLight(0xffffff,1));
 //创建立方体
 let myGeometry = new THREE.BoxGeometry(60, 60, 60);
 let myMap = THREE.ImageUtils.loadTexture("../images/img076.jpg");
 let myMaterial = new THREE.MeshPhongMaterial({map: myMap});
 let myMesh = new THREE.Mesh(myGeometry, myMaterial);
 myScene.add(myMesh);
 //在场景中实现后期特效(为立方体添加飘白特效)
 let myEffectComposer=new THREE.EffectComposer(myRenderer);
 myEffectComposer.addPass(new THREE.RenderPass(myScene,myCamera));
 let myShaderPass=new THREE.ShaderPass(THREE.BleachBypassShader);
 myShaderPass.uniforms['opacity'].value = 2.9; // 设置漂白程度
 myEffectComposer.addPass(myShaderPass);
 //渲染经过漂白的立方体
 animate();
 function animate(){
  myEffectComposer.render();
  requestAnimationFrame(animate);
 }
 //创建轨道控制器(旋转、缩放图形)
 let myOrbitControls=new THREE.OrbitControls(myCamera);
 //响应单击“轻微漂白图形”按钮
 $("#myButton1").click(function () {
  myShaderPass.uniforms['opacity'].value = 2.9;
 });
 //响应单击“强力漂白图形”按钮
 $("#myButton2").click(function () {
  myShaderPass.uniforms['opacity'].value = 100.9;
 });
</script></body></html>
